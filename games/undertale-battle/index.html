<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undertale-style Battle | Select Version</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .select-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .select-title {
            font-family: 'VT323', monospace;
            font-size: 4rem;
            margin-bottom: 2rem;
            color: #fff;
        }

        .select-options {
            display: flex;
            gap: 2rem;
        }

        .select-card {
            background: #000;
            border: 4px solid #fff;
            padding: 2rem;
            width: 250px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            color: #fff;
        }

        .select-card:hover {
            background: #fff;
            color: #000;
            transform: scale(1.05);
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }

        .version-name {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .version-desc {
            font-size: 0.9rem;
            margin-top: 0.5rem;
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div class="select-container">
        <h1 class="select-title">SELECT VERSION</h1>
        <div class="select-options">
            <a href="game_pc.html" class="select-card">
                <span class="icon">⌨️</span>
                <span class="version-name">PC版</span>
                <p class="version-desc">キーボード操作にお勧め</p>
            </a>
            <a href="game_mobile.html" class="select-card">
                <span class="icon">📱</span>
                <span class="version-name">スマホ版</span>
                <p class="version-desc">タッチパネル操作にお勧め</p>
            </a>
        </div>
        <p style="margin-top: 3rem; color: #666; font-size: 0.8rem;">* あなたの デバイスに 合わせて えらんでね。</p>
    </div>
</body>

</html>
